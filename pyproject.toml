[project]
name = "omnimind"
version = "0.1.0"
description = "OmniMind - Cross-platform knowledge management application with AI features"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.23.2",
    "pydantic>=2.4.2",
    "sqlalchemy>=2.0.22",
    "alembic>=1.12.0",
    "psycopg2-binary>=2.9.9",
    "pymongo>=4.5.0",
    "redis>=5.0.1",
    "celery>=5.3.4",
    "flower>=2.0.1",
    "python-jose>=3.3.0",
    "passlib>=1.7.4",
    "python-multipart>=0.0.6",
    "beautifulsoup4>=4.12.2",
    "requests>=2.31.0",
    "aiohttp>=3.8.6",
    "pillow>=10.0.1",
    "python-docx>=0.8.11",
    "pypdf>=3.16.2",
    "pytesseract>=0.3.10",
    "transformers>=4.34.0",
    "sentence-transformers>=2.2.2",
    "nltk>=3.8.1",
    "scikit-learn>=1.3.1",
    "spacy>=3.7.1",
    "langchain>=0.0.312",
    "openai>=0.28.1",
    "ffmpeg-python>=0.2.0",
    "yt-dlp>=2023.10.13",
    "minio>=7.1.17",
    "pytest>=7.4.2",
    "pytest-asyncio>=0.21.1",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.9.1",
    "isort>=5.12.0",
    "mypy>=1.6.1",
    "flake8>=6.1.0",
    "pytest-cov>=4.1.0",
    "pre-commit>=3.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
